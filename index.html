<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crush Block Blast</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: linear-gradient(rgba(15, 16, 32, 0.85), rgba(15, 16, 32, 0.85)), url('a9c53d190bd175a8146feaf60239d335.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 850px;
            background: rgba(22, 22, 44, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
        }
        h1 {
            font-size: 20px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            letter-spacing: 1px;
        }
        .score-board {
            font-size: 14px;
            color: #a0a0c0;
        }
        #score {
            color: #4eacc5;
            font-weight: bold;
        }
        
        #music-toggle-btn {
            background: #0f3460;
            border: 1px solid #e94560;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.4);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 3px;
            width: 310px;
            height: 310px;
            background: #111122;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid #2a2a4e;
        }
        .cell {
            background: #1a1a38;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
        }

        #pieces-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            height: 130px;
