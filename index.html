<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crush Block Blast</title>
<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
    touch-action: manipulation;
}
body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f1020 url('a9c53d190bd175a8146feaf60239d335.jpg') center/cover no-repeat;
}

#game-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 850px;
    background: rgba(22, 22, 44, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 5px;
    z-index: 5;
}

h1 {
    font-size: 18px;
    color: #e94560;
    text-shadow: 0 0 8px rgba(233, 69, 96, 0.6);
    font-weight: 800;
}

.score-board {
    font-size: 14px;
    color: #a0a0c0;
}

#score {
    color: #4eacc5;
    font-weight: bold;
    font-size: 16px;
}

/* Tebrik Konuşma Balonu */
#speech-bubble {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: linear-gradient(135deg, #e94560, #0f3460);
    border: 2px solid #fff;
    border-radius: 18px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    z-index: 50;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    width: 88%;
}

#speech-bubble.active {
    transform: translateX(-50%) scale(1);
}

#speech-bubble img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #fff;
    object-fit: cover;
}

#speech-bubble .text-container {
    display: flex;
    flex-direction: column;
}

#speech-bubble .member-name {
    font-size: 11px;
    font-weight: bold;
    color: #ffd700;
}

#speech-bubble .member-message {
    font-size: 12px;
    font-weight: bold;
    color: #fff;
}

#board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 3px;
    width: 300px;
    height: 300px;
    background: rgba(17, 17, 34, 0.95);
    padding: 5px;
    border-radius: 10px;
    border: 2px solid #2a2a4e;
}

.cell {
    background: rgba(26, 26, 56, 0.8);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
}

.cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#pieces-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    height: 110px;
    background: rgba(17, 17, 34, 0.9);
    border-radius: 10px;
    padding: 5px;
    border: 2px solid #2a2a4e;
}

.piece-slot {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    transition: border 0.15s;
}

.piece-slot.selected {
    border: 2px solid #e94560 !important;
    background: rgba(233, 69, 96, 0.2);
}

.mini-grid {
    display: grid;
    gap: 2px;
    pointer-events: none;
}

.mini-cell {
    width: 20px;
    height: 20px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.mini-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Ekranlar / Menü */
.screen {
    position: absolute;
    inset: 0;
    background: rgba(15, 15, 26, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    text-align: center;
}

.hidden {
    display: none !important;
}

.btn {
    background: linear-gradient(45deg, #e94560, #0f3460);
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 15px;
    box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
}

.btn:active {
    transform: scale(0.96);
}
</style>
</head>
<body>

<div id="game-container">
    <header>
        <div>
            <h1>CRUSH BLOCK BLAST</h1>
            <div class="score-board">Skor: <span id="score">0</span></div>
        </div>
    </header>

    <div id="speech-bubble">
        <img id="bubble-img" src="" alt="Crush">
        <div class="text-container">
            <span class="member-name" id="bubble-name">Arda</span>
            <span class="member-message" id="bubble-msg">Lesssssgo!</span>
        </div>
    </div>

    <div id="board"></div>

    <div id="pieces-container">
        <div class="piece-slot" id="slot-0"></div>
        <div class="piece-slot" id="slot-1"></div>
        <div class="piece-slot" id="slot-2"></div>
    </div>

    <div id="menu-screen" class="screen">
        <h1 style="font-size: 26px; margin-bottom: 8px; color: #e94560;">CRUSH BLOCK BLAST</h1>
        <p style="margin-bottom: 20px; color: #a0a0c0; font-size: 14px;">7 üyeli Crush ekibinin bulmacası!</p>
        <button class="btn" id="start-btn">OYUNA BAŞLA</button>
    </div>
