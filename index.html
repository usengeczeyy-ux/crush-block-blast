<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crush Block Blast</title>
<style>
* {
box-sizing: border-box;
user-select: none;
-webkit-user-select: none;
margin: 0;
padding: 0;
touch-action: manipulation;
}
body, html {
width: 100%;
height: 100%;
overflow: hidden;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
color: #fff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: #0f1020 url('a9c53d190bd175a8146feaf60239d335.jpg') center/cover no-repeat;
}

#game-container {
position: relative;
width: 100%;
max-width: 450px;
height: 100%;
max-height: 850px;
background: rgba(22, 22, 44, 0.85);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
padding: 15px;
box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(233, 69, 96, 0.4);
border-radius: 16px;
border: 1px solid rgba(255, 255, 255, 0.1);
}

header {
display: flex;
justify-content: space-between;
align-items: center;
width: 100%;
padding: 0 5px;
z-index: 5;
}

h1 {
font-size: 20px;
color: #e94560;
text-shadow: 0 0 10px rgba(233, 69, 96, 0.6);
letter-spacing: 1px;
font-weight: 800;
}

.score-board {
font-size: 14px;
color: #a0a0c0;
}

#score {
color: #4eacc5;
font-weight: bold;
font-size: 16px;
}

#music-toggle-btn {
background: #0f3460;
border: 1px solid #e94560;
color: white;
padding: 6px 12px;
font-size: 12px;
border-radius: 15px;
cursor: pointer;
font-weight: bold;
box-shadow: 0 0 8px rgba(233, 69, 96, 0.4);
}

/* Konuşma Kutusu (Speech Bubble) */
#speech-bubble {
position: absolute;
top: 60px;
left: 50%;
transform: translateX(-50%) scale(0);
background: linear-gradient(135deg, #e94560, #0f3460);
border: 2px solid #fff;
border-radius: 20px;
padding: 8px 16px;
display: flex;
align-items: center;
gap: 10px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
z-index: 50;
transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
pointer-events: none;
max-width: 90%;
}

#speech-bubble.active {
transform: translateX(-50%) scale(1);
}

#speech-bubble img {
width: 40px;
height: 40px;
border-radius: 50%;
border: 2px solid #fff;
object-fit: cover;
}

#speech-bubble .text-container {
display: flex;
flex-direction: column;
text-align: left;
}

#speech-bubble .member-name {
font-size: 11px;
font-weight: bold;
color: #ffd700;
text-transform: uppercase;
}

#speech-bubble .member-message {
font-size: 13px;
font-weight: 700;
color: #ffffff;
}

#board {
display: grid;
grid-template-columns: repeat(8, 1fr);
grid-template-rows: repeat(8, 1fr);
gap: 3px;
width: 320px;
height: 320px;
background: rgba(17, 17, 34, 0.9);
padding: 6px;
border-radius: 12px;
border: 2px solid #2a2a4e;
position: relative;
box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}

.cell {
background: rgba(26, 26, 56, 0.8);
border-radius: 4px;
display: flex;
align-items: center;
justify-content: center;
position: relative;
overflow: hidden;
transition: background-color 0.2s;
}

.cell img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 3px;
}

#pieces-container {
display: flex;
justify-content: space-around;
align-items: center;
width: 100%;
height: 120px;
background: rgba(17, 17, 34, 0.8);
border-radius: 12px;
padding: 10px;
border: 2px solid #2a2a4e;
}

.piece-slot {
width: 90px;
height: 90px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
background: rgba(255, 255, 255, 0.03);
border-radius: 8px;
transition: transform 0.15s, border 0.15s;
touch-action: none;
}

.piece-slot.selected {
border: 2px solid #e94560 !important;
background: rgba(233, 69, 96, 0.15);
}

.mini-grid {
display: grid;
gap: 2px;
pointer-events: none;
}

.mini-cell {
width: 22px;
height: 22px;
border-radius: 3px;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
}

.mini-cell img {
width: 100%;
height: 100%;
object-fit: cover;
}

.screen {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(15, 15, 26, 0.95);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 100;
padding: 20px;
text-align: center;
border-radius: 16px;
}

.hidden {
display: none !important;
}

.btn {
background: linear-gradient(45deg, #e94560, #0f3460);
color: white;
border: none;
padding: 12px 30px;
font-size: 16px;
font-weight: bold;
border-radius: 25px;
cursor: pointer;
box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
margin-top: 15px;
transition: transform 0.1s;
}

.btn:active {
transform: scale(0.95);
}

.music-selector {
display: flex;
flex-direction: column;
gap: 8px;
width: 100%;
max-width: 280px;
margin-bottom: 10px;
}

.music-option {
background: #16213e;
border: 2px solid #0f3460;
padding: 10px;
border-radius: 10px;
cursor: pointer;
font-size: 13px;
font-weight: bold;
}

.music-option.active {
border-color: #e94560;
background: #0f3460;
box-shadow: 0 0 10px rgba(233, 69, 96, 0.4);
}

#yt-player {
position: absolute;
width: 0;
height: 0;
opacity: 0;
pointer-events: none;
}
</style>
</head>
<body>

<div id="yt-player"></div>

<div id="game-container">
<header>
<div>
<h1>CRUSH BLOCK BLAST</h1>
<div class="score-board">Skor: <span id="score">0</span></div>
</div>
<button id="music-toggle-btn">🔊 Müzik: Açık</button>
</header>

<div id="speech-bubble">
<img id="bubble-img" src="" alt="Crush Üyesi">
<div class="text-container">
<span class="member-name" id="bubble-name">Arda</span>
<span class="member-message" id="bubble-msg">Lesssssgo!</span>
</div>
</div>

<div id="board"></div>

<div id="pieces-container">
<div class="piece-slot" id="slot-0"></div>
<div class="piece-slot" id="slot-1"></div>
<div class="piece-slot" id="slot-2"></div>
</div>

<div id="menu-screen" class="screen">
<h1 style="font-size: 26px; margin-bottom: 8px;">CRUSH BLOCK BLAST</h1>
<p style="margin-bottom: 15px; color: #a0a0c0; font-size: 14px;">7 üyeli Crush ekibinin bul
